server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 30m;

    # Реальный IP клиента принимаем только от доверенного прокси (TLS-терминатор на хосте приходит через docker-мост).
    # Прокси должен ДОПИСЫВАТЬ адрес клиента в X-Forwarded-For ($proxy_add_x_forwarded_for): nginx берёт крайний
    # правый недоверенный адрес, поэтому значение, подставленное самим клиентом, игнорируется.
    # Если используется внешний балансировщик — добавьте сюда его подсеть.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Адрес backend определяется через DNS Docker при каждом запросе (с кэшем 10 с),
    # чтобы перезапуск или масштабирование backend не требовали перезапуска nginx
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
